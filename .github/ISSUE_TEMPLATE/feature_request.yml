name: Feature request
description: Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: dropdown
    id: brand
    attributes:
      label: Battery brand
      options:
        - Lunergy
        - Sunpura
        - Voltdeer
        - AEG
        - AFERIY
        - AccuMate
        - JET
        - Oscal
        - Other
        - Not brand-specific
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Problem or use case
      placeholder: 'I want to ... because ...'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context
