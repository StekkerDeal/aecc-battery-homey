version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 5
    groups:
      # vitest and its plugins pin each other's exact version, so they
      # have to move in one PR. Listed first because the first matching
      # group wins.
      vitest:
        patterns: ['vitest', '@vitest/*']
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
