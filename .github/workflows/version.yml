name: Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        description: Changelog entry for this release, shown in the Homey App Store
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump Homey app version
        id: version
        uses: athombv/github-action-homey-app-version@3342f092b437550e78074797b52fac6467a456e1 # master
        with:
          version: ${{ github.event.inputs.version }}
          changelog: ${{ github.event.inputs.changelog }}

      # The subject stays one line: this repo's commits never carry a body, and
      # a changelog entry is many lines. It lives in .homeychangelog.json and
      # in the release notes instead.
      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD --tags

      # The tag alone is not enough: the README badge reads Releases, not tags,
      # and free-text notes go through the environment rather than the shell.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes "${CHANGELOG}"
