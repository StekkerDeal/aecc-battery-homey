<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.brand.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.brand.intro"></p>
</header>

<fieldset class="homey-form-fieldset">
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="brand"
      data-i18n="pair.brand.brand"
    ></label>
    <select class="homey-form-select" id="brand">
      <option value="lunergy">Lunergy</option>
      <option value="sunpura">Sunpura</option>
      <option value="voltdeer">Voltdeer</option>
      <option value="aeg">AEG</option>
      <option value="aferiy">AFERIY</option>
      <option value="accumate">AccuMate</option>
      <option value="jet">JET</option>
      <option value="oscal">Oscal</option>
      <option value="other" id="option-other" selected></option>
    </select>
  </div>
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="model"
      data-i18n="pair.brand.model"
    ></label>
    <input class="homey-form-input" id="model" type="text" value="" />
  </div>
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="max-charge"
      data-i18n="pair.brand.max_charge"
    ></label>
    <input class="homey-form-input" id="max-charge" type="number" value="800" />
  </div>
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="max-discharge"
      data-i18n="pair.brand.max_discharge"
    ></label>
    <input
      class="homey-form-input"
      id="max-discharge"
      type="number"
      value="800"
    />
  </div>
  <p class="homey-subtitle" data-i18n="pair.brand.power_hint"></p>
</fieldset>

<button
  id="btn-next"
  class="homey-button-primary-full"
  data-i18n="pair.brand.next"
></button>

<script type="application/javascript">
  document.getElementById('option-other').textContent =
    Homey.__('pair.brand.other');

  const next = document.getElementById('btn-next');

  next.addEventListener('click', async () => {
    const brand = document.getElementById('brand').value;
    const model = document.getElementById('model').value.trim();
    const maxChargePower =
      Number(document.getElementById('max-charge').value) || 800;
    const maxDischargePower =
      Number(document.getElementById('max-discharge').value) || 800;

    next.classList.add('is-loading', 'is-disabled');

    try {
      await Homey.emit('set_brand', {
        brand,
        model,
        max_charge_power: maxChargePower,
        max_discharge_power: maxDischargePower,
      });
      // Explicit, because this view declares no navigation of its own: the
      // button below is the only way forward, so there is no duplicate.
      Homey.showView('add_devices');
    } catch (error) {
      next.classList.remove('is-loading', 'is-disabled');
      Homey.alert((error && error.message) || Homey.__('pair.brand.failed'));
    }
  });
</script>
