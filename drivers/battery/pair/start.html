<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.start.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.start.intro"></p>
</header>

<button
  id="btn-search"
  class="homey-button-primary-full"
  data-i18n="pair.start.search"
></button>
<button
  id="btn-manual"
  class="homey-button-secondary-full"
  data-i18n="pair.start.manual"
></button>

<script type="application/javascript">
  document.getElementById('btn-search').addEventListener('click', () => {
    Homey.showView('list_devices');
  });

  document.getElementById('btn-manual').addEventListener('click', () => {
    Homey.showView('manual_entry');
  });
</script>
