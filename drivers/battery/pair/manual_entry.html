<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.manual.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.manual.intro"></p>
</header>

<fieldset class="homey-form-fieldset">
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="host"
      data-i18n="pair.manual.host"
    ></label>
    <input class="homey-form-input" id="host" type="text" value="192.168.1." />
  </div>
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="port"
      data-i18n="pair.manual.port"
    ></label>
    <input class="homey-form-input" id="port" type="number" value="8080" />
  </div>
  <div class="homey-form-group">
    <label
      class="homey-form-label"
      for="name"
      data-i18n="pair.manual.name"
    ></label>
    <input class="homey-form-input" id="name" type="text" value="" />
  </div>
  <p class="homey-subtitle" data-i18n="pair.manual.name_hint"></p>
</fieldset>

<button
  id="btn-connect"
  class="homey-button-primary-full"
  data-i18n="pair.manual.connect"
></button>

<script type="application/javascript">
  const connect = document.getElementById('btn-connect');

  connect.addEventListener('click', async () => {
    const host = document.getElementById('host').value.trim();
    const port = Number(document.getElementById('port').value) || 8080;
    const name = document.getElementById('name').value.trim();

    if (!host) {
      Homey.alert(Homey.__('pair.manual.host_required'));
      return;
    }

    connect.classList.add('is-loading', 'is-disabled');

    try {
      await Homey.emit('manual_connect', { host, port, name });
      // Explicit, because this view declares no navigation of its own: the
      // button below is the only way forward, so there is no duplicate.
      Homey.showView('choose_brand');
    } catch (error) {
      connect.classList.remove('is-loading', 'is-disabled');
      Homey.alert((error && error.message) || Homey.__('pair.manual.failed'));
    }
  });
</script>
