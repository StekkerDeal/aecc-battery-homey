<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <!-- Sibling of the battery driver icon: identical frame, nub and corner
       radii, with a sun inside instead of the charge level, because this
       device is the PV input on that same battery rather than a separate
       array. Homey renders driver icons as a monochrome mask, so this is
       flat black with no background. The sun sits inside a 154px half-width
       window, so the rays stop at radius 140 and never touch the frame. -->
  <rect x="400" y="90" width="160" height="90" rx="12" />
  <path
    fill-rule="evenodd"
    d="M286 170h388a56 56 0 0 1 56 56v548a56 56 0 0 1-56 56H286a56 56 0 0 1-56-56V226a56 56 0 0 1 56-56z
       M326 240h308a26 26 0 0 1 26 26v468a26 26 0 0 1-26 26H326a26 26 0 0 1-26-26V266a26 26 0 0 1 26-26z"
  />
  <circle cx="480" cy="480" r="78" />
  <g>
    <rect x="467" y="340" width="26" height="40" rx="13" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(45 480 480)" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(90 480 480)" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(135 480 480)" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(180 480 480)" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(225 480 480)" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(270 480 480)" />
    <rect x="467" y="340" width="26" height="40" rx="13" transform="rotate(315 480 480)" />
  </g>
</svg>
